<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Навигация</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a0a !important;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a !important;
            color: #ffffff;
            padding: 70px 16px 20px;
            height: 100%;
            overflow-y: auto;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .container {
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
            padding-bottom: 30px;
        }

        .header {
            text-align: center;
            padding: 10px 0 35px;
        }

        .header .title {
            font-family: 'DynaPuff', cursive;
            font-weight: 800;
            font-size: 52px;
            color: #ffffff;
            letter-spacing: 1px;
            line-height: 1.1;
        }

        .header .subtitle {
            font-family: 'DynaPuff', cursive;
            font-weight: 700;
            font-size: 22px;
            color: #d5d5dd;
            margin-top: 2px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .category {
            margin-bottom: 32px;
        }

        .category-title {
            font-size: 20px;
            font-weight: 700;
            color: #d0d0d8;
            padding: 0 0 12px 4px;
            border-bottom: 1px solid #1e1e1e;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 26px;
            margin-top: 12px;
            background: #141414;
            border-radius: 18px;
            border: none;
            width: 100%;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
            font-size: 21px;
            color: #a0a0a8;
            text-align: left;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            user-select: none;
        }

        .link-item:active {
            background: #1a1a1a;
            transform: scale(0.97);
        }

        .link-item:focus {
            outline: none;
        }

        .link-item .left {
            display: flex;
            align-items: center;
            gap: 18px;
            min-width: 0;
            flex-shrink: 1;
            overflow: visible;
        }

        .link-item .left .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .link-item .left .name {
            font-weight: 500;
            color: #f0f0f0;
            font-size: 21px;
            white-space: nowrap;
            overflow: visible;
            text-overflow: clip;
        }

        .link-item .arrow {
            color: #3a3a3c;
            font-size: 26px;
            font-weight: 300;
            margin-left: 8px;
            flex-shrink: 0;
        }

        .close-btn {
            margin-top: 30px;
            padding: 16px;
            background: #2a2a2a;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .close-btn:active {
            opacity: 0.6;
        }

        @media (min-width: 600px) {
            body {
                padding: 90px 24px 30px;
            }
            .container {
                max-width: 480px;
            }
            .header .title {
                font-size: 60px;
            }
            .header .subtitle {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="header">
            <div class="title">CT Family</div>
            <div class="subtitle">Навигация</div>
        </div>

        <!-- === ОСНОВНОЕ === -->
        <div class="category">
            <div class="category-title">Основное</div>

            <button class="link-item" data-url="https://t.me/CT_FAMILY_NEWS">
                <span class="left">
                    <img class="avatar" src="https://i.ibb.co/pjdNLFD1/IMG-20260826-173923-346.jpg" alt="avatar">
                    <span class="name">CT Family</span>
                </span>
                <span class="arrow">›</span>
            </button>

            <button class="link-item" data-url="https://t.me/boost/CT_FAMILY_NEWS">

            <button class="link-item" data-url="https://tiktok.com/@ct_family_news">

                    <img class="avatar" src="https://i.ibb.co/pjdNLFD1/IMG-20260826-173923-346.jpg" alt="avatar">

                    <span class="name">CT Family Price</span>
                </span>
                <span class="arrow">›</span>
            </button>

            <button class="link-item" data-url="https://t.me/+R-upvz8N2Ro2Yzky">
                <span class="left">
                    <img class="avatar" src="https://i.ibb.co/Xx4HjbLg/IMG-20260826-193720-507.jpg" alt="avatar">
                    <span class="name">⚡️CT FAMILY CHAT⚡️</span>
                </span>
                <span class="arrow">›</span>
            </button>

            <button class="link-item" data-url="https://telegra.ph/Pravila-CT-FAMILY-03-20-2">
                <span class="left">
                    <img class="avatar" src="https://i.ibb.co/nqWVxBFg/file-00000000cb00820aad26a373d98b42dd.png" alt="avatar">
                    <span class="name">CT Family (Правила)</span>
                </span>

            </button>
        </div>

        <!-- === КЛУБЫ === -->
        <div class="category">
            <div class="category-title">Клубы</div>

            <button class="link-item" data-url="https://t.me/CT_Invites_bot">
                <span class="left">
                    <img class="avatar" src="https://i.ibb.co/wr29nhD0/IMG-20260826-192542-375.jpg" alt="avatar">
                    <span class="name">⚡CT Invites</span>
                </span>

            </button>

            <button class="link-item" data-url="https://t.me/CTclubbot">
                <span class="left">
                    <img class="avatar" src="https://i.ibb.co/67XTdscT/file-000000005878820a8f9ef92dda63a2e0.png" alt="avatar">
                    <span class="name">CT Club (bot)</span>
                </span>

            </button>

            <button class="link-item" data-url="https://t.me/CTclubbot/app">
                <span class="left">

        <!-- === SHOP === -->
        <div class="category">
            <div class="category-title">Shop</div>

            <button class="link-item" data-url="https://t.me/CT_Family_Donat">
                <span class="left">
                    <img class="avatar" src="https://i.ibb.co/twZLMkzq/IMG-20260826-191841-916.jpg" alt="avatar">
                    <span class="name">CT Shop 🌴</span>
                </span>
                <span class="arrow">›</span>
            </button>

            <button class="link-item" data-url="https://t.me/CT_Family_Donat">
                <span class="left">
                    <img class="avatar" src="https://i.ibb.co/twZLMkzq/IMG-20260826-191841-916.jpg" alt="avatar">
                    <span class="name">CT Shop 🌴 (boost)</span>

            <button class="link-item" data-url="https://t.me/CT_FAMILY_DONAT_REVIEWS">
                <span class="left">

        </div>

        <!-- === ЧЁРНЫЙ СПИСОК === -->

            <div class="category-title">Чёрный список</div>

            <button class="link-item" data-url="https://t.me/BLACKLIST_CT_FAMILY">
                <span class="left">
                    <img class="avatar" src="https://i.ibb.co/PsnFkrWR/IMG-20260826-191648-905.jpg" alt="avatar">
                    <span class="name">Blacklist CT Family</span>
                </span>
                <span class="arrow">›</span>
            </button>
        </div>

        <button class="close-btn" id="closeBtn" style="display:none;">Закрыть</button>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.requestFullscreen();

        tg.setBackgroundColor('#0a0a0a');
        tg.setHeaderColor('#0a0a0a');

        document.addEventListener('selectstart', (e) => e.preventDefault());

        document.querySelectorAll('.link-item').forEach(btn => {
            btn.addEventListener('click', function() {
                const url = this.dataset.url;
                if (url) tg.openLink(url);
            });
        });

        if (!window.Telegram || !window.Telegram.WebApp) {
            document.getElementById('closeBtn').style.display = 'block';
            document.getElementById('closeBtn').addEventListener('click', () => window.close());
        }
    </script>
</body>
            </html>
