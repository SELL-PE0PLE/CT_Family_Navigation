<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Навигация</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            padding: 90px 16px 20px;
            height: 100%;
            overflow-y: auto;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        /* Контейнер */
        .container {
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
            padding-bottom: 30px;
        }

        /* Категория */
        .category {
            margin-bottom: 32px;
        }

        .category-title {
            font-size: 20px;
            font-weight: 700;
            color: #d0d0d8;
            padding: 0 0 12px 4px;
            border-bottom: 1px solid #1e1e1e;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        /* Кнопка-ссылка */
        .link-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 18px;
            margin-top: 8px;
            background: #141414;
            border-radius: 14px;
            border: none;
            width: 100%;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
            font-size: 17px;
            color: #a0a0a8;
            text-align: left;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            user-select: none;
        }

        .link-item:active {
            background: #1a1a1a;
            transform: scale(0.97);
        }

        .link-item:focus {
            outline: none;
        }

        .link-item .left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .link-item .left .emoji {
            font-size: 24px;
            line-height: 1;
            width: 32px;
            text-align: center;
        }

        .link-item .left .name {
            font-weight: 400;
            color: #a0a0a8;
            font-size: 17px;
        }

        .link-item .arrow {
            color: #3a3a3c;
            font-size: 20px;
            font-weight: 300;
            margin-left: 8px;
        }

        /* Кнопка закрытия (если вне Telegram) */
        .close-btn {
            margin-top: 30px;
            padding: 16px;
            background: #2a2a2a;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .close-btn:active {
            opacity: 0.6;
        }

        /* Адаптив */
        @media (min-width: 600px) {
            body {
                padding: 100px 24px 30px;
            }
            .container {
                max-width: 480px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- === ОСНОВНОЕ === -->
        <div class="category">
            <div class="category-title">Основное
